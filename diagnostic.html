<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnostic</title>
  </head>
  <body>
    <pre id="out">loading</pre>
    <iframe id="page" src="index.html" style="width: 390px; height: 1100px; border: 0"></iframe>
    <script>
      setTimeout(() => {
        const iframe = document.getElementById("page");
        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;
        const root = doc.documentElement;
        const body = doc.body;
        const overflowing = [...doc.querySelectorAll("body *")]
          .map((el) => {
            const rect = el.getBoundingClientRect();
            return {
              tag: el.tagName.toLowerCase(),
              cls: String(el.className || ""),
              id: el.id || "",
              left: Math.round(rect.left),
              right: Math.round(rect.right),
              width: Math.round(rect.width),
              text: (el.textContent || "").trim().slice(0, 70),
            };
          })
          .filter((item) => item.left < -1 || item.right > win.innerWidth + 1)
          .slice(0, 60);
        document.getElementById("out").textContent = JSON.stringify(
          {
            innerWidth: win.innerWidth,
            rootClientWidth: root.clientWidth,
            rootScrollWidth: root.scrollWidth,
            bodyClientWidth: body.clientWidth,
            bodyScrollWidth: body.scrollWidth,
            overflowing,
          },
          null,
          2,
        );
      }, 1600);
    </script>
  </body>
</html>
